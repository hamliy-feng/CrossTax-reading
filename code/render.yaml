services:
  - type: web
    name: crosstax-workbench
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn workbench:app --app-dir web --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CROSSTAX_ENV
        value: production
      - key: CROSSTAX_DATABASE_CONFIRM
        value: crosstax
      - key: CROSSTAX_PUBLIC_ORIGIN
        sync: false
      - key: CROSSTAX_APP_DATABASE_URL
        sync: false
      - key: CROSSTAX_LEGAL_DATABASE_URL
        sync: false
      - key: NEON_AUTH_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CROSSTAX_FILE_BUCKET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
